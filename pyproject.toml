[project]
name = "pegasus-utis"
version = "0.1.0"
description = "Pegasus-UTIS modular consent-based tracking and intelligence framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pegasus-UTIS"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "python-dateutil>=2.9",
  "matplotlib>=3.8",
]

[project.scripts]
utis = "utis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
